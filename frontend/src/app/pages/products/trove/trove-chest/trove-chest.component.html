<!-- One viewBox around the chest; artifacts appear near its top edge and fall into the opening -->
<svg class="chest" [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMax meet">
  <defs>
    @for (artifact of drawing.artifacts; track artifact.id) {
      <clipPath [attr.id]="artifact.id"><path [attr.d]="artifact.cut" /></clipPath>
    }
  </defs>

  <!-- Feet, body, fittings, rim band, then the contents' surface inside the rim -->
  @for (part of drawing.chest; track $index) {
    <path [attr.class]="'chest__' + part.kind" [attr.d]="part.d" />
  }

  <ng-template #outline let-artifact>
    @for (part of artifact.parts; track $index) {
      <path [attr.class]="'chest__' + part.kind" [attr.d]="part.d" />
    }
  </ng-template>

  <!-- In motion: each artifact drops, sinks below the surface and waits for its next turn.
       Back to front, each clipped where it meets the surface. -->
  <g class="chest__motion">
    @for (artifact of drawing.artifacts; track artifact.id) {
      <g [attr.clip-path]="'url(#' + artifact.id + ')'">
        <g opacity="0">
          <animateTransform
            attributeName="transform"
            type="translate"
            calcMode="spline"
            repeatCount="indefinite"
            [attr.dur]="artifact.dur"
            [attr.begin]="artifact.begin"
            [attr.values]="artifact.motion.values"
            [attr.keyTimes]="artifact.motion.keyTimes"
            [attr.keySplines]="artifact.motion.keySplines"
          />
          <animate
            attributeName="opacity"
            repeatCount="indefinite"
            [attr.dur]="artifact.dur"
            [attr.begin]="artifact.begin"
            [attr.values]="artifact.fade.values"
            [attr.keyTimes]="artifact.fade.keyTimes"
          />
          <ng-container *ngTemplateOutlet="outline; context: { $implicit: artifact }" />
        </g>
      </g>
    }
    @for (sparkle of drawing.sparkles; track $index) {
      <path class="chest__sparkle" opacity="0" [attr.d]="sparkle.d">
        <animate
          attributeName="opacity"
          values="0;0;1;0;0"
          keyTimes="0;0.42;0.5;0.58;1"
          repeatCount="indefinite"
          [attr.dur]="sparkle.dur"
          [attr.begin]="sparkle.begin"
        />
      </path>
    }
  </g>

  <!-- Still: the pose shown under prefers-reduced-motion, one artifact per slot at rest -->
  <g class="chest__still">
    @for (artifact of drawing.artifacts; track artifact.id) {
      @if (artifact.still) {
        <g [attr.clip-path]="'url(#' + artifact.id + ')'">
          <g [attr.transform]="artifact.still">
            <ng-container *ngTemplateOutlet="outline; context: { $implicit: artifact }" />
          </g>
        </g>
      }
    }
    @for (sparkle of drawing.sparkles; track $index) {
      <path class="chest__sparkle" [attr.d]="sparkle.d" />
    }
  </g>
</svg>
